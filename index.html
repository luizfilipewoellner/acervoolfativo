<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Acervo Olfativo</title>
<meta name="description" content="A coleção de perfumes do casal: coleção, desejos, acordes, pirâmide e contratipos.">
<meta name="theme-color" content="#7a2c4e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Acervo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: estante de frascos — cabeçalho fixo com abas, grade de cartões, ficha em painel deslizante */
:root{
  --bg:#f5f2f6; --surface:#ffffff; --sunk:#ece6ee; --ink:#231925; --muted:#6c6170; --line:#e1d9e4;
  --accent:#7a2c4e; --accent-ink:#ffffff; --gold:#a8812f; --danger:#b3261e; --ok:#2e7d4f;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161118; --surface:#211a24; --sunk:#2a222d; --ink:#f2ebf3; --muted:#a99daf; --line:#372d3b;
  --accent:#d683a8; --accent-ink:#1c1219; --gold:#d8b46c; --danger:#ff8a80; --ok:#7fd3a0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161118; --surface:#211a24; --sunk:#2a222d; --ink:#f2ebf3; --muted:#a99daf; --line:#372d3b;
  --accent:#d683a8; --accent-ink:#1c1219; --gold:#d8b46c; --danger:#ff8a80; --ok:#7fd3a0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 10px;flex-wrap:wrap;position:relative;padding-right:44px}
.top #menu{position:absolute;right:-8px;top:12px}
.brand h1{font-family:var(--display);font-weight:400;font-style:italic;font-size:clamp(28px,5vw,40px);line-height:1;margin:0;letter-spacing:-.01em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.stats{display:flex;gap:18px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.stats b{display:block;font-family:var(--display);font-size:22px;color:var(--ink);font-weight:500}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:12px}
.tabs{display:flex;background:var(--sunk);border-radius:999px;padding:3px}
.tab{border:0;background:none;padding:7px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.tab .n{font-family:var(--mono);font-size:11px;margin-left:4px;opacity:.7}
.search{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px}
select.f{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}

main{padding-block:22px 60px}
.notice{border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px;color:var(--muted);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:start;text-align:left;transition:transform .15s,border-color .15s}
.card .cb{display:flex;flex-direction:column;gap:9px;min-width:0;height:100%}
.card:hover{transform:translateY(-2px);border-color:var(--muted)}
.card .meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .ph{width:76px;height:100px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:contain;padding:4px;box-sizing:border-box}
.card .ph svg{height:72px;width:auto}
.dphoto{margin:14px 0 4px;border-radius:var(--r);background:var(--sunk);display:grid;place-items:center;overflow:hidden;max-height:340px}
.dphoto img{width:100%;max-height:340px;object-fit:contain}
.photofield{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.photofield .thumb{width:78px;height:96px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;flex:none}
.photofield .thumb img{width:100%;height:100%;object-fit:cover}.photofield .thumb svg{height:70px}
.photofield .pfb{display:flex;flex-direction:column;gap:6px;flex:1 1 180px;min-width:0}
.photofield .pfb .links{gap:6px}
.card h3{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.15;margin:0;text-wrap:balance}
.card .marca{color:var(--muted);font-size:13px;margin-top:-5px}
.strip{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.strip span{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.chip.dono{background:none;border:1px solid var(--line)}
.chip.cat{color:var(--gold);background:none;border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.foot{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:auto}

.empty{text-align:center;padding:50px 16px;color:var(--muted)}
.empty h2{font-family:var(--display);font-style:italic;font-weight:400;color:var(--ink);font-size:28px;margin:0 0 8px}
.empty p{max-width:52ch;margin:0 auto 18px}

/* painel */
.scrim{position:fixed;inset:0;background:rgb(10 5 12 / .45);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(620px,100%);height:100%;overflow-y:auto;padding:max(18px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(30px,env(safe-area-inset-bottom,0px)) 20px;box-shadow:-8px 0 30px rgb(0 0 0 / .2);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.card{transition:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sheet h2{font-family:var(--display);font-weight:500;font-size:clamp(28px,6vw,38px);line-height:1.05;margin:4px 0 2px;text-wrap:balance}
.sheet .sub{color:var(--muted)}
section.blk{margin-top:26px}
section.blk>h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.accords{display:flex;flex-direction:column;gap:5px}
.acc{height:26px;border-radius:5px;display:flex;align-items:center;padding:0 10px;font-size:13px;font-weight:600;min-width:fit-content;white-space:nowrap}
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px}
.tier{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:center}
.tier:nth-child(1){width:72%}.tier:nth-child(2){width:86%}.tier:nth-child(3){width:100%}
.tier .lbl{font-family:var(--display);font-style:italic;font-size:15px;margin-bottom:6px}
.tier .chips{justify-content:center}
.notes{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 6px}
.nt{width:74px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;line-height:1.2;text-align:center;overflow-wrap:anywhere}
.nt .ic{width:50px;height:50px;border-radius:50%;background:var(--sunk);display:grid;place-items:center}
.nt svg{width:38px;height:38px;display:block}
.dupes{display:flex;flex-direction:column;gap:8px}
.dupe{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.dupe .nm{font-weight:600;min-width:0}
.dupe .mk{color:var(--muted);font-size:13px}
.sim{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px}
.sim i{display:block;height:5px;border-radius:3px;background:var(--accent)}
.sim .tr{width:90px;background:var(--sunk);border-radius:3px}
.dupe .act{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.price{font-family:var(--mono);font-size:13px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{color:var(--accent);font-weight:600;font-size:14px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kv small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.note{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
.src{font-size:12px;color:var(--muted);margin-top:6px}

form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){form .row{grid-template-columns:1fr}}
form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
form input,form select,form textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font-weight:400;font-size:15px;color:var(--ink);min-width:0}
form textarea{min-height:70px;resize:vertical}
.fieldset{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.fetchbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:14px}
.addlinks{gap:8px}.addlinks:not(:has(.addlink:not([hidden]))){display:none}
#b-showpaste{white-space:normal;text-align:left}
.btn.addlink{padding:6px 14px;font-size:13px;border-style:dashed}
.sughead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sughead h2{font-family:var(--display);font-style:italic;font-weight:400;font-size:28px;margin:0;line-height:1.1}
.sughead p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:9px}
.scard .meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.scard h3{font-family:var(--display);font-weight:500;font-size:20px;line-height:1.15;margin:0}
.scard .marca{color:var(--muted);font-size:13px;margin-top:-5px}
.scard .why{font-size:14px;line-height:1.45}
.scard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.scard .acts .btn{padding:6px 12px;font-size:13px}
a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.scard .borjialt{font-size:13px;color:var(--muted)}.scard .borjialt b{color:var(--accent)}
.fetchrow{display:flex;gap:8px;align-items:flex-end}
.fetchrow label{flex:1}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.status.err{color:var(--danger)}.status.ok{color:var(--ok)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:14px;color:var(--ink);font-weight:500}
.seg input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.pricehead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.offers{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.offer{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.offer .lj{min-width:0;font-weight:600}.offer .lj a{color:inherit}.offer small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.offer .pill{grid-column:1/-1;justify-self:start}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.chip.borji{background:none;border:1px solid var(--accent);color:var(--accent)}
.pill.off{color:var(--muted);background:var(--sunk)}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.best{font-size:13px;color:var(--muted)}.best b{font-family:var(--mono);color:var(--ink);font-weight:500}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--danger) 10%,var(--surface));border-radius:10px;padding:8px 12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:40}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.iconbtn{font-size:20px;line-height:1;padding:6px 12px}
@media (max-width:560px){
  .bar .search{flex:1 1 100%;order:2}
  .bar .tabs{order:1}
  .bar select.f{order:3;flex:1 1 0;min-width:0;padding-left:10px;padding-right:6px}
  .bar #add{order:1;margin-left:auto;padding:8px 14px;font-size:18px;line-height:1}
  .bar #add .lbl{display:none}
  .tab{padding:7px 12px}
  .stats{gap:14px}.stats b{font-size:20px}
}
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.loginbox{width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.loginbox h1{font-family:var(--display);font-style:italic;font-weight:400;font-size:40px;margin:0;line-height:1}
.loginbox label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.loginbox input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--ink)}
.gsrc{font-size:12px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}.gsrc a{color:var(--accent)}
.errdet{margin-top:4px;font-size:12px;color:var(--muted)}.errdet summary{cursor:pointer}
.gsugg{margin-top:8px;max-width:100%;overflow-x:auto}
input,select,textarea{font-size:16px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <h1>Acervo Olfativo</h1>
        <p>A coleção de perfumes do casal</p>
      </div>
      <div class="stats" id="stats"></div>
      <button class="btn ghost iconbtn" id="menu" aria-label="Ajustes">⋯</button>
    </div>
    <div class="bar">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-tenho" aria-selected="true" data-tab="tenho">Coleção<span class="n" id="n-tenho"></span></button>
        <button class="tab" role="tab" id="tab-desejo" aria-selected="false" data-tab="desejo">Desejos<span class="n" id="n-desejo"></span></button>
        <button class="tab" role="tab" id="tab-sug" aria-selected="false" data-tab="sug">Sugestões</button>
      </div>
      <input class="search" id="q" type="search" placeholder="Buscar nome, marca, nota ou acorde">
      <select class="f" id="fdono" aria-label="Filtrar por dono">
        <option value="">Todos</option><option value="ele">Luiz Filipe</option><option value="ela">Heloíse</option><option value="casal">Compartilhado</option>
      </select>
      <select class="f" id="fcat" aria-label="Filtrar por categoria">
        <option value="">Categorias</option>
      </select>
      <select class="f" id="fsort" aria-label="Ordenar">
        <option value="recentes">Mais recentes</option><option value="nome">Perfume A–Z</option><option value="marca">Marca A–Z</option>
      </select>
      <button class="btn primary" id="add" aria-label="Adicionar perfume">+<span class="lbl"> Adicionar</span></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="notice" class="notice" hidden></div>
  <div id="grid" class="grid"></div>
  <section id="sug" hidden></section>
  <div id="empty" class="empty" hidden></div>
</main>

<div id="layer"></div>
<div id="toast" class="toast" hidden></div>
<div id="login" class="login" hidden>
  <form id="lf" class="loginbox" autocomplete="on">
    <h1>Acervo Olfativo</h1>
    <p class="sub">A coleção de perfumes do casal. Entre com o e-mail de vocês.</p>
    <label>E-mail<input id="l-email" type="email" autocomplete="username" required></label>
    <label>Senha<input id="l-pass" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Entrar</button>
    <button class="btn ghost" type="button" id="l-reset">Esqueci a senha</button>
    <div class="status" id="lstatus"></div>
  </form>
</div>

<script>
const CATS=["Nicho","Designer","Nacional","Árabe","Contratipo"];
const CONC=["","Eau de Cologne","Eau de Toilette","Eau de Parfum","Parfum","Extrait de Parfum","Elixir","Body splash"];
const DONO={ele:"Luiz Filipe",ela:"Heloíse",casal:"Compartilhado"};
// Na lista de desejos não há dono: o campo vira "Para quem".
const PARA={ele:"Para Luiz Filipe",ela:"Para Heloíse",casal:"Para os dois"};
const donoTxt=p=>(p.tipo==="desejo"?PARA:DONO)[p.dono]||"";
function donoOpts(tipo){return tipo==="desejo"?[["ele","Luiz Filipe"],["ela","Heloíse"],["casal","Os dois"]]:[["ele","Luiz Filipe"],["ela","Heloíse"],["casal","Compartilhado"]]}
const ACC_COLORS={
  "amadeirado":"#7b4f2a","cítrico":"#f2d64b","floral":"#f4a6c6","floral branco":"#f6e7ee","rosa":"#e2577a","fresco especiado":"#9ccc7e",

function startData(){
  if(unsubs.length)return;
  state.col=fb.collection(fb.db,"perfumes");
  const t=setTimeout(()=>{if(!state.loaded)showNotice("Ainda sem resposta da nuvem. O que vocês adicionarem fica guardado no aparelho e sincroniza quando a internet voltar.")},10000);
  unsubs.push(fb.onSnapshot(state.col,{includeMetadataChanges:false},snap=>{
    state.items=snap.docs.map(d=>({id:d.id,...d.data()}));
    state.loaded=true; clearTimeout(t);
    if(!snap.metadata.fromCache)$("notice").hidden=true;
    render(); refreshOpenDetail();
  },err=>{
    clearTimeout(t); state.loaded=true;
    showNotice(err.code==="permission-denied"?"Este e-mail ainda não tem acesso à coleção. Inclua-o nas regras do Firestore (veja o LEIA-ME).":"Não foi possível acessar a coleção agora.");
    render();
  }));
  unsubs.push(fb.onSnapshot(fb.doc(fb.db,"lojas","sugestoes"),sn=>{sugDoc=sn.exists()?sn.data():{};if(state.tab==="sug")render()},()=>{}));
  unsubs.push(fb.onSnapshot(fb.doc(fb.db,"lojas","config"),sn=>{appCfg=sn.exists()?sn.data():{};render();refreshOpenDetail()},()=>{}));
  unsubs.push(fb.onSnapshot(fb.doc(fb.db,"lojas","borji"),sn=>{
    const d=sn.exists()?sn.data():null;
    if(d&&Array.isArray(d.itens)&&(!borji||(d.atualizadoEm||0)>=(borji.atualizadoEm||0))){borji=d;render();refreshOpenDetail()}
  },()=>{}));
}

/* ---------- Gemini (Firebase AI Logic) ---------- */
let aiMod=null; const aiModels={};
async function gemini(kind){
  if(aiModels[kind])return aiModels[kind];
  if(!aiMod)aiMod=await import(FB+"firebase-ai.js");
  const m=aiMod, ai=m.getAI(fb.fapp,{backend:new m.GoogleAIBackend()});
  const TL=m.ThinkingLevel||{};
  let cfg;
  if(kind==="think")cfg={model:GEMINI_MODEL,generationConfig:{thinkingConfig:{thinkingLevel:TL.LOW||"LOW"}}};
  else if(kind==="fast")cfg={model:GEMINI_FAST_MODEL,generationConfig:{thinkingConfig:{thinkingLevel:TL.MINIMAL||"MINIMAL"}}};
  else if(kind==="webfast")cfg={model:GEMINI_FAST_MODEL,tools:[{urlContext:{}}],generationConfig:{thinkingConfig:{thinkingLevel:TL.MINIMAL||"MINIMAL"}}};
  else{const tools=[{urlContext:{}}];if(USE_GOOGLE_SEARCH)tools.push({googleSearch:{}});cfg={model:GEMINI_MODEL,tools,generationConfig:{thinkingConfig:{thinkingLevel:TL.LOW||"LOW"}}}}
  aiModels[kind]={m,ai,cfg,model:m.getGenerativeModel(ai,cfg)};
  return aiModels[kind];
}
// kind: "web" (lê páginas) ou "fast" (só conhecimento do modelo, bem mais rápido)
async function askGemini(prompt,kind="web",timeoutMs=90000){
  if(!fb.fapp)throw new Error("offline");
  const g=await gemini(kind);
  const run=mdl=>Promise.race([mdl.generateContent(prompt),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),timeoutMs))]);
  let r;
  try{r=await run(g.model)}
  catch(e){
    // Se o modelo não aceitar o ajuste de raciocínio, tenta de novo sem ele.
    const msg=String(e?.message||"");
    if(/thinking/i.test(msg)){const {generationConfig,...rest}=g.cfg;g.model=g.m.getGenerativeModel(g.ai,rest);g.cfg=rest;r=await run(g.model)}
    // Se o modelo rápido não conseguir ler páginas, usa o modelo principal.
    // Se o modelo leve falhar (ou a cota diária dele acabar), tenta o modelo principal, que tem cota separada.
    else if(kind==="webfast"&&!/^timeout$|App Check|offline|Failed to fetch/i.test(msg))return askGemini(prompt,"web",timeoutMs);
    else throw e;
  }
  const resp=r.response;
  let text=""; try{text=resp.text()}catch(e){}
  const um=resp.candidates?.[0]?.urlContextMetadata?.urlMetadata||[];
  const urlOk=um.some(x=>/SUCCESS/i.test(String(x.urlRetrievalStatus||x.url_retrieval_status||"")));
  return {text,json:parseJSON(text),grounding:resp.candidates?.[0]?.groundingMetadata||null,urlOk,urlTried:um.length>0};
}
function parseJSON(t){
  if(!t)return null;
  try{return JSON.parse(t)}catch(e){}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(f){try{return JSON.parse(f[1])}catch(e){}}
  const a=t.indexOf("{"),b=t.lastIndexOf("}"); if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  return null;
}
function aiErr(e){
  const m=String(e?.message||e||"");
  console.error("Gemini:",e);
  const det=`<details class="errdet"><summary>Detalhes</summary>${esc(m.slice(0,600))}</details>`;
  if(/per day|daily|PerDay/i.test(m)&&/\b(429|quota)\b/i.test(m))return "Acabou a cota gratuita do Gemini de hoje. Ela renova todo dia por volta das 5h (horário de Brasília). Até lá, dá para preencher à mão."+det;
  if(/\b(429|quota|RESOURCE_EXHAUSTED|rate[- ]?limit)\b/i.test(m))return "Muitas buscas em pouco tempo. Espere um minuto e tente de novo."+det;
  if(/not.*enabled|has not been used|PERMISSION_DENIED|\b403\b|api-not-enabled|API key not valid|referer/i.test(m))return "O Gemini não está liberado para este app (AI Logic desativado ou chave da API restrita)."+det;
  if(/offline|network|Failed to fetch/i.test(m))return "Sem internet para consultar o Gemini."+det;
  if(/^timeout$/.test(m))return "O Gemini demorou demais para responder. Tente de novo."+det;
  if(/App Check/i.test(m))return "O App Check está bloqueando o Gemini. Desative a exigência para o AI Logic no console do Firebase (App Check → APIs)."+det;
  if(/not found|\b404\b|is not supported|unsupported model/i.test(m))return "O modelo do Gemini configurado não está disponível. Troque GEMINI_MODEL no index.html."+det;
  return "Não consegui consultar o Gemini agora. Tente de novo ou preencha à mão."+det;
}

// Reduz a foto para caber no banco (cerca de 30–60 KB), mantendo boa qualidade na tela do celular.
async function shrinkPhoto(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const MAX=520, k=Math.min(1,MAX/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.max(1,Math.round(img.naturalWidth*k)), h=Math.max(1,Math.round(img.naturalHeight*k));
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    const cx=cv.getContext("2d"); cx.fillStyle="#ffffff"; cx.fillRect(0,0,w,h); cx.drawImage(img,0,0,w,h);
    let q=0.8, out=cv.toDataURL("image/jpeg",q);
    while(out.length>120000&&q>0.4){q-=0.1;out=cv.toDataURL("image/jpeg",q)}
    return out;
  }finally{URL.revokeObjectURL(url)}
}

function perfilTxt(para){

${tem}

Lista de desejos:

const BORJI="https://www.borjieco.com.br/";
const STOP=new Set(["de","da","do","des","du","di","d","l","s","the","for","pour","le","la","les","eau","parfum","perfume","perfumes","edp","edt","extrait","toilette","cologne","e","and","et","by","parfums","&"]);
const tok=s=>plain(s).replace(/[^a-z0-9]+/g," ").split(" ").filter(w=>w&&!STOP.has(w));
const tcase=s=>String(s||"").toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
function borjiMatches(p){
  if(!borji||!Array.isArray(borji.itens))return [];
  if(/borji/.test(plain(p.marca))){const n=plain(p.nome).trim();return borji.itens.filter(x=>plain(x.n)===n).map(x=>({...x,extra:0,self:true}))}
  const insp=(p.inspiradoEm||"").replace(/\(.*?\)/g," ");
  const nameT=tok(insp||p.nome);
  if(!nameT.length)return [];
  const allT=new Set(tok([p.inspiradoEm||"",p.nome,p.marca].join(" ")));
  const out=[];
  for(const x of borji.itens){
    const it=tok(x.i), set=new Set(it);
    if(!nameT.every(t=>set.has(t)))continue;
    const extra=it.filter(t=>!allT.has(t)).length;
    if(extra<=2)out.push({...x,extra});
  }
  return out.sort((a,b)=>a.extra-b.extra||(b.p>0)-(a.p>0)||a.i.length-b.i.length).slice(0,3);
}
function borjiSection(p){
  if(!borji)return "";
  const m=borjiMatches(p);
  const quando=borji.atualizadoEm?new Date(borji.atualizadoEm).toLocaleDateString("pt-BR"):"";
  const row=x=>`<div class="dupe"><div class="nm"><a href="${esc(BORJI+x.u)}" target="_blank" rel="noopener" style="color:inherit">${esc(tcase(x.n))}</a> <span class="mk">· inspirado em ${esc(x.i)}</span></div>
    <div class="act">${x.p>0?`<span class="price">${esc(money(x.p))}</span>`:`<span class="pill off">indisponível</span>`}${x.self?"":`<button class="btn" style="padding:4px 10px;font-size:12px" onclick="borjiToWish('${esc(p.id)}','${esc(x.u)}')">+ Desejos</button>`}</div>
    <div class="sim">${x.self?"este perfume na loja":x.extra?"versão parecida":"mesma inspiração"}${x.g?" · "+esc(x.g.toLowerCase()):""}</div></div>`;
  return `<section class="blk"><h4>Borji &amp; Co</h4>${m.length?`<div class="dupes">${m.map(row).join("")}</div>`:`<div class="notice">A Borji &amp; Co não tem um contratipo deste perfume no catálogo.</div>`}
    <div class="src">Catálogo de ${esc(quando)} · ${esc(borji.itens.length)} perfumes</div></section>`;
}

function applyFrag(j,info,fonte){

    if(!alive()||webDone)return;
    const n=applyScen(r.json,info);
    if(n){setStatus(`<span class="spin"></span>${n} sugestões prévias. Lendo a página do Scentido para trazer % de semelhança e preços…`,"ok");btn.disabled=false}
  }).catch(()=>{});
  // 2) Leitura da página real, que substitui as sugestões prévias.
  try{
    const r=await askGemini(scenPrompt(url,info,true),"webfast",60000);
    webDone=true;
    if(!alive())return;
    renderGrounding($("gsrc"),r.grounding);
    const n=applyScen(r.json,info);
    if(n)setStatus(`${n} contratipos lidos do Scentido. Salvem para guardar.`,"ok");
    else if((draft.contratipos||[]).length)setStatus("Não encontrei contratipos na página; ficaram as sugestões prévias (sem preços).","ok");
    else setStatus("O Gemini não encontrou contratipos para esse perfume.","err");
  }catch(e){
    webDone=true; await fast;
    if(!alive())return;
    if((draft.contratipos||[]).length)setStatus("Não consegui abrir a página do Scentido; ficaram as sugestões prévias (sem preços nem % de semelhança).","ok");
    else setStatus(aiErr(e),"err");
  }finally{if(alive())btn.disabled=false}
}

async function searchPrices(id){
  const p=state.items.find(x=>x.id===id); if(!p)return;
  const st=$("pstatus"), b=$("b-price"); b.disabled=true; st.className="status";
  st.innerHTML=`<span class="spin"></span>O Gemini está consultando os comparadores de preço…`;
  const alvo=[p.nome,p.marca,p.concentracao,p.tamanhoMl?p.tamanhoMl+" ml":""].filter(Boolean).join(", ");
  const lk=shopLinks(p);
  const prompt=`${USE_GOOGLE_SEARCH?"Pesquise no Google":"Abra estas páginas de busca de comparadores de preço e leia as ofertas:\n"+lk[1][1]+"\n"+lk[2][1]+"\nCom base nelas, informe"} o preço atual, em lojas que vendem no Brasil, do perfume: ${alvo}.
Considere só este perfume (mesmo nome, marca e concentração; se o tamanho foi informado, prefira esse tamanho). Ignore kits, miniaturas, decants, amostras e outros perfumes da mesma linha. Use apenas preços que aparecem nas páginas encontradas; não estime.
Responda SOMENTE com um JSON, sem texto antes ou depois:
{"ofertas":[{"loja":"","preco":0,"titulo":"descrição curta com o tamanho","url":"link da oferta"}]}
Até 8 ofertas, da mais barata para a mais cara, preço em reais como número. Se não encontrar, devolva {"ofertas":[]}.`;
  try{
    const r=await askGemini(prompt,"webfast",60000);
    const of=(r.json?.ofertas||[]).filter(o=>o&&o.loja&&Number(o.preco)>0).slice(0,8).map(o=>({loja:String(o.loja),preco:Number(o.preco),titulo:String(o.titulo||"").slice(0,90),url:/^https?:\/\//.test(o.url||"")?String(o.url):""}));
    const {id:_,...d}=p; d.precos={data:Date.now(),fonte:USE_GOOGLE_SEARCH?"Gemini + Pesquisa Google":"Gemini (Zoom e Buscapé)",ofertas:of,...slimGrounding(r.grounding)};
    await save(id,d);
    toast(of.length?`${of.length} ofertas encontradas`:"Nenhuma oferta encontrada agora");
  }catch(e){const s2=$("pstatus");if(s2){s2.className="status err";s2.innerHTML=aiErr(e)}}
  finally{const bb=$("b-price");if(bb)bb.disabled=false}
}

/* ---------- ajustes: conta, backup, catálogo Borji ---------- */
$("menu").onclick=openMenu;
function openMenu(){
  openId=null;
  const quando=borji?.atualizadoEm?new Date(borji.atualizadoEm).toLocaleDateString("pt-BR"):"";
  layer(`<div class="sheet-head"><div><div class="eyebrow">Conta</div><h2>Ajustes</h2><div class="sub">${esc(state.user?.email||"")}</div></div>
      <button class="btn ghost" onclick="closeLayer()" aria-label="Fechar">✕</button></div>
    <section class="blk"><h4>Backup da coleção</h4>
      <div class="links"><button class="btn" onclick="exportBackup()">Exportar (.json)</button><label class="btn" for="imp">Importar backup</label><input type="file" accept="application/json,.json" id="imp" hidden></div>
      <div class="status" id="mstatus">O backup guarda todos os perfumes, desejos e notas.</div></section>
    <section class="blk"><h4>Catálogo Borji &amp; Co</h4>
      <p class="sub">${borji?`${esc(borji.itens.length)} perfumes · atualizado em ${esc(quando)}`:"Ainda não carregado."}</p>
      <button class="btn" id="b-borji" onclick="refreshBorji()">Atualizar com o Gemini</button>
      <div class="status" id="bstatus"></div>
      <form id="bimg" class="fieldset" style="margin-top:14px">
        <div class="photofield"><div class="thumb"><img id="bimg-prev" src="${esc(appCfg.borjiImg||BORJI_IMG_PADRAO)}" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith(bottleEl('#d683a8'))"></div>
        <div class="pfb"><div class="eyebrow">Imagem usada nos perfumes Borji</div>
          <input id="bimg-url" type="url" inputmode="url" placeholder="Link da imagem" value="${esc(appCfg.borjiImg||BORJI_IMG_PADRAO)}">
          <div class="links"><button class="btn" type="submit">Salvar imagem</button></div></div></div>
        <div class="sub" style="font-size:12px">No site da Borji, toque e segure a foto de um frasco e escolha "Copiar endereço da imagem".</div>
      </form></section>
    <div class="actions"><button class="btn danger" onclick="logout()">Sair da conta</button></div>`);
  $("imp").onchange=e=>{const f=e.target.files[0];if(f)importBackup(f)};
  $("bimg-url").oninput=e=>{const pv=$("bimg-prev");if(pv)pv.src=e.target.value.trim()};
  $("bimg").onsubmit=e=>{e.preventDefault();const u=$("bimg-url").value.trim();
    if(u&&!/^https?:\/\//.test(u)){toast("Cole um link que comece com https://");return}
    fb.setDoc(fb.doc(fb.db,"lojas","config"),{...appCfg,borjiImg:u},{merge:true}).then(()=>toast("Imagem da Borji salva")).catch(()=>toast("Não foi possível salvar."))};
}
function exportBackup(){
  const data={app:"acervo-olfativo",versao:1,exportadoEm:new Date().toISOString(),perfumes:state.items};
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
  a.download=`acervo-olfativo-${new Date().toISOString().slice(0,10)}.json`;
  document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function importBackup(file){
  const st=$("mstatus");
  try{
    const j=JSON.parse(await file.text());
    const list=Array.isArray(j)?j:(j.perfumes||[]);
    if(!list.length){st.className="status err";st.textContent="Esse arquivo não tem perfumes.";return}
    let n=0;
    for(const x of list){
      if(!x||!x.nome)continue;
      const {id,...d}=x;
      const ref=id?fb.doc(state.col,String(id)):fb.doc(state.col);
      fb.setDoc(ref,d).catch(()=>{}); n++;
    }
    st.className="status ok";st.textContent=`${n} perfumes importados.`;
  }catch(e){st.className="status err";st.textContent="Não consegui ler esse arquivo. Use um backup exportado pelo app."}
}
async function refreshBorji(){
  const b=$("b-borji"), st=$("bstatus"); b.disabled=true; st.className="status";
  const base="https://www.borjieco.com.br/";
  const all=new Map();
  const price=s=>{s=String(s||"").replace(/[^\d.,]/g,"");if(!s)return 0;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");return Number(s)||0};
  try{
    for(let start=1;start<=29;start+=4){
      st.innerHTML=`<span class="spin"></span>Lendo as páginas ${start} a ${start+3} da loja…`;
      const urls=[0,1,2,3].map(i=>`${base}CategoriaId_0,${start+i},destaque.html`);
      const prompt=`Abra estas páginas da listagem de produtos da loja Borji & Co e liste TODOS os produtos de cada uma:
${urls.join("\n")}
Escreva uma linha por produto, exatamente no formato abaixo, e nada mais:
TÍTULO COMPLETO DO PRODUTO | preço em reais (0 se indisponível) | URL completa do produto
Se uma página não existir ou não tiver produtos, ignore-a.`;
      const r=await askGemini(prompt,"webfast",90000);
      let found=0;
      for(const line of (r.text||"").split("\n")){
        const parts=line.replace(/^[-*\d.\s]+(?=[A-Za-zÀ-ú0-9])/,"").split("|").map(s=>s.trim());
        if(parts.length<3)continue;
        const m=parts[0].match(/^(.+?)\s+PERFUME\s+INSPIRADO:\s*(.+)$/i);
        const url=(parts[2].match(/https?:\/\/\S+/)||[""])[0];
        if(!m||!url.startsWith(base))continue;
        let insp=m[2].replace(/\s*C[ÓO]D\..*$/i,"").trim();
        const g=(insp.match(/\(\s*(Masculino|Feminino|Compartilh[aá]vel)\s*\)\s*$/i)||[])[1]||"";
        insp=insp.replace(/\s*\(\s*(Masculino|Feminino|Compartilh[aá]vel)\s*\)\s*$/i,"").trim();
        const u=url.slice(base.length);
        if(!all.has(u)){all.set(u,{n:m[1].trim(),i:insp,g,p:/indispon/i.test(parts[1])?0:price(parts[1]),u});found++}
      }
      if(!found)break;
    }
    const itens=[...all.values()];
    const atual=borji?.itens?.length||0;
    if(itens.length<Math.max(20,atual*0.8)){
      st.className="status err";st.textContent=`O Gemini só conseguiu ler ${itens.length} perfumes, então mantive o catálogo atual (${atual}). Tente de novo mais tarde.`;
      return;
    }
    const novo={itens,atualizadoEm:Date.now(),total:itens.length,fonte:base+"produtos"};
    await fb.setDoc(fb.doc(fb.db,"lojas","borji"),novo);
    borji=novo; render();
    st.className="status ok";st.textContent=`Catálogo atualizado: ${itens.length} perfumes.`;
  }catch(e){st.className="status err";st.innerHTML=aiErr(e)}
  finally{const bb=$("b-borji");if(bb)bb.disabled=false}
}
